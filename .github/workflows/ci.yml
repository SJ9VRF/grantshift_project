name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: make all
      - run: pip wheel --no-deps --no-build-isolation . -w /tmp/wheels
      - run: grantshift-agent decide --state examples/state.json --model artifacts/personalized_policy.joblib
      - run: python scripts/audit_repo.py
