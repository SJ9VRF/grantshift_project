[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantshift-agent"
version = "1.7.0"
description = "Dynamic authorization stress-testing for personalized AI agents"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<4", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
research = ["pytest>=8,<9", "matplotlib>=3.8,<4", "scipy>=1.12,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
grantshift-agent = "grantshift.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grantshift*", "grantshiftbench*", "evaluation*"]
exclude = ["tests*", "demo*", "paper*", "reports*", "artifacts*", "dashboard*", "experiments*", "training*", "docs*", "examples*", "configs*"]
